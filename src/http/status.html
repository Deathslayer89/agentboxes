<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>agentbox</title>
<style>
  :root { color-scheme: light dark; --fg: #1a1a1a; --bg: #fafafa; --muted: #6b6b6b; --line: #dedede; --ok: #1f7a3a; --warn: #a65d00; }
  @media (prefers-color-scheme: dark) { :root { --fg: #e6e6e6; --bg: #141414; --muted: #9a9a9a; --line: #2e2e2e; --ok: #5fcf7f; --warn: #e3a44a; } }
  body { margin: 0; padding: 20px 16px; font: 14px/1.45 system-ui, sans-serif; color: var(--fg); background: var(--bg); }
  h1 { font-size: 18px; margin: 0 0 12px; }
  h1 span { color: var(--muted); font-weight: normal; font-size: 13px; margin-left: 8px; }
  .row { display: flex; flex-wrap: wrap; gap: 24px; margin-bottom: 16px; }
  .stat b { display: block; font-size: 20px; font-weight: 600; }
  .stat { color: var(--muted); }
  table { border-collapse: collapse; width: 100%; max-width: 1100px; }
  th, td { text-align: left; padding: 6px 10px 6px 0; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { color: var(--muted); font-weight: 500; }
  td.num, th.num { text-align: right; padding-right: 16px; }
  .ok { color: var(--ok); } .warn { color: var(--warn); } .muted { color: var(--muted); }
  #error { color: var(--warn); margin-top: 12px; }
</style>
</head>
<body>
<h1>agentbox <span id="updated"></span></h1>
<div class="row" id="host"></div>
<table>
  <thead><tr><th>sandbox</th><th>owner</th><th>template</th><th>status</th><th class="num">age</th><th class="num">expires in</th><th class="num">cpu</th><th class="num">memory</th><th>network</th></tr></thead>
  <tbody id="rows"></tbody>
</table>
<div id="error"></div>
<script>
  const key = localStorage.getItem("agentboxKey");
  const headers = key ? { authorization: "Bearer " + key } : {};
  const seconds = (s) => s >= 3600 ? Math.floor(s / 3600) + "h " + Math.floor((s % 3600) / 60) + "m" : s >= 60 ? Math.floor(s / 60) + "m " + (s % 60) + "s" : s + "s";
  const stat = (label, value) => `<div class="stat"><b>${value}</b>${label}</div>`;
  const text = (v) => String(v).replace(/[&<>"]/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[ch]);

  async function get(path) {
    const res = await fetch(path, { headers });
    if (res.status === 401) {
      const entered = prompt("This server needs an API key");
      if (entered) { localStorage.setItem("agentboxKey", entered); location.reload(); }
      throw new Error("API key needed");
    }
    if (!res.ok) throw new Error(path + " answered " + res.status);
    return res.json();
  }

  async function tick() {
    try {
      const [stats, usage] = await Promise.all([get("/stats"), get("/usage")]);
      const pools = Object.entries(stats.pools).map(([name, p]) => `${p.ready}/${p.size} ${name}`).join(", ") || "none";
      const hits = Object.values(stats.pools).reduce((n, p) => n + p.hits, 0);
      const misses = Object.values(stats.pools).reduce((n, p) => n + p.misses, 0);
      document.getElementById("host").innerHTML =
        stat("sandboxes live / max", `${stats.sandboxes.live} / ${stats.sandboxes.max}`) +
        stat("warm pool ready", text(pools)) +
        stat("pool hits / misses", `${hits} / ${misses}`) +
        stat(`host load (${usage.host.cpus} cpus)`, usage.host.load1.toFixed(2)) +
        stat("host memory used", `${(usage.host.memoryUsedMb / 1024).toFixed(1)} / ${(usage.host.memoryTotalMb / 1024).toFixed(1)} GB`);
      document.getElementById("rows").innerHTML = usage.sandboxes.map((s) => `<tr>
        <td><code>${text(s.id)}</code></td><td>${text(s.owner)}</td><td>${text(s.template)}</td>
        <td class="${s.status === "busy" ? "warn" : "ok"}">${text(s.status)}</td>
        <td class="num">${seconds(s.ageSeconds)}</td>
        <td class="num ${s.expiresInSeconds < 60 ? "warn" : ""}">${seconds(s.expiresInSeconds)}</td>
        <td class="num">${s.cpuPercent === null ? '<span class="muted">...</span>' : s.cpuPercent.toFixed(0) + "%"}</td>
        <td class="num">${s.memoryMb === null ? '<span class="muted">...</span>' : s.memoryMb.toFixed(0) + " / " + (s.limits.memoryMb + s.limits.diskMb) + " MB"}</td>
        <td>${s.allowHosts === 0 ? '<span class="muted">none</span>' : s.allowHosts + " host rule" + (s.allowHosts === 1 ? "" : "s")}</td>
      </tr>`).join("") || '<tr><td colspan="9" class="muted">no live sandboxes</td></tr>';
      document.getElementById("updated").textContent = "updated " + new Date().toLocaleTimeString();
      document.getElementById("error").textContent = "";
    } catch (err) {
      document.getElementById("error").textContent = String(err.message || err);
    }
  }
  tick();
  setInterval(tick, 2000);
</script>
</body>
</html>
