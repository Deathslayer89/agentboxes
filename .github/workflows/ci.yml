name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  unit:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:python
      - run: npm run build
      - run: node bin/agentbox.js help
      - run: sh -n bin/setup.sh
      - run: npm pack --dry-run
  integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Set up the host with the package's own script
        run: |
          if bin/setup.sh --check; then echo "expected a runner without gVisor" && exit 1; fi
          bin/setup.sh
          bin/setup.sh --check
          docker version --format 'Docker {{.Server.Version}}'
      - run: npm ci
      - run: npm run test:integration
      - name: Python examples against a live server
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -q ./sdk-python -r examples/openai-agents/requirements.txt -r examples/langgraph/requirements.txt -r examples/claude-agent-sdk/requirements.txt
          npm start > server.log 2>&1 &
          for i in $(seq 1 60); do curl -sf localhost:7788/health > /dev/null && break; sleep 1; done
          .venv/bin/python -m unittest -v examples/test_python_examples.py
          npm stop
          cat server.log
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t agentbox .
