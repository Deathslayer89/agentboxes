[project]
name = "agentboxes"
version = "0.2.1"
description = "Python client for an agentbox server: sandboxes for AI agents on your own Linux box"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agentbox*"]
